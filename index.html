<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf7ff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>หน้าแนะนำตัว | ก้อย</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #193653;
      --muted: #58728b;
      --blue: #278bd1;
      --blue-dark: #176da9;
      --sky: #eaf7ff;
      --line: #d8edfa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 56px) 18px;
      color: var(--ink);
      font-family: "Mali", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 8% 14%, #bfeaff 0 2px, transparent 3px),
        radial-gradient(circle at 92% 26%, #bfeaff 0 3px, transparent 4px),
        radial-gradient(ellipse at 12% 16%, #d5f0ff 0, transparent 32%),
        radial-gradient(ellipse at 88% 84%, #d8f5f3 0, transparent 30%),
        linear-gradient(145deg, #f7fcff, var(--sky));
    }

    .bunny {
      position: fixed;
      z-index: 0;
      right: max(22px, 5vw);
      bottom: 20px;
      width: 156px;
      height: 138px;
      opacity: .72;
      pointer-events: none;
      animation: puppyFloat 3.4s ease-in-out infinite;
    }

    .bunny .ear {
      position: absolute;
      top: 0;
      width: 34px;
      height: 76px;
      border: 3px solid #8bc8e9;
      border-radius: 55% 55% 45% 45%;
      background: linear-gradient(145deg, #fff, #dff4ff);
      box-shadow: inset 0 -8px 12px rgba(105, 185, 230, .14);
    }

    .bunny .ear.left { left: 34px; transform: rotate(-12deg); }
    .bunny .ear.right { right: 34px; transform: rotate(12deg); }

    .bunny .head {
      position: absolute;
      z-index: 1;
      top: 43px;
      left: 28px;
      width: 100px;
      height: 91px;
      border: 3px solid #8bc8e9;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(145deg, #fff, #e8f8ff);
      box-shadow: 0 8px 20px rgba(39, 139, 209, .12);
    }

    .bunny .head::before {
      position: absolute;
      top: 42px;
      left: 25px;
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: #4b84a5;
      box-shadow: 37px 0 #4b84a5;
      content: "";
    }

    .bunny .head::after {
      position: absolute;
      top: 54px;
      left: 47px;
      width: 7px;
      height: 5px;
      border-radius: 50%;
      background: #ec91aa;
      content: "";
    }

    .bunny .mouth {
      position: absolute;
      top: 60px;
      left: 47px;
      width: 8px;
      height: 9px;
      border-right: 1.5px solid #a76f83;
      border-bottom: 1.5px solid #a76f83;
      border-left: 1.5px solid #a76f83;
      border-radius: 0 0 6px 6px;
    }

    .bunny .teeth {
      position: absolute;
      top: 69px;
      left: 45px;
      width: 12px;
      height: 9px;
      border: 1px solid #d7eaf4;
      border-radius: 0 0 4px 4px;
      background: #fff;
    }

    @keyframes puppyFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      overflow: hidden;
      padding: clamp(28px, 6vw, 52px);
      border: 2px solid rgba(255, 255, 255, .98);
      border-radius: 36px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 0 0 1px #d8f0fc, 0 28px 80px rgba(48, 112, 155, .17), 0 4px 14px rgba(48, 112, 155, .06);
      backdrop-filter: blur(12px);
    }

    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 9px;
      content: "";
      background: linear-gradient(90deg, #7bd5f4, #68b9f0, #91e2dc);
    }

    .tag {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 8px;
      margin: 0 auto 18px;
      padding: 7px 13px;
      border: 1px solid #d7effb;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f0faff;
      font-size: .9rem;
      font-weight: 700;
    }

    .tag::before { content: "✦"; color: #38a9dc; }

    .mascot {
      position: absolute;
      top: 34px;
      right: 36px;
      width: 76px;
      height: 82px;
      animation: bob 2.6s ease-in-out infinite;
      transform-origin: 50% 90%;
    }

    .profile {
      float: none;
      width: 142px;
      height: 142px;
      margin: 0 auto 18px;
      overflow: hidden;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #dff4ff;
      box-shadow: 0 0 0 5px #eaf8ff, 0 0 0 7px #c8eafa, 0 12px 28px rgba(39, 139, 209, .2);
    }

    .profile svg { display: none; }
    .profile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      animation: photoSway 4s ease-in-out infinite;
    }

    @keyframes photoSway {
      0%, 100% { transform: scale(1) rotate(0); }
      50% { transform: scale(1.04) rotate(.6deg); }
    }

    .profile-wrap {
      position: relative;
      width: max-content;
      margin: 0 auto 18px;
      animation: avatarFloat 3.4s ease-in-out infinite;
    }

    .profile-wrap::before {
      position: absolute;
      z-index: 1;
      inset: -11px;
      border: 2px dashed #81c9eb;
      border-radius: 50%;
      content: "";
      animation: ringSpin 18s linear infinite;
    }

    .profile-wrap::after {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: -20px;
      color: #f3a8c3;
      font-size: 1.35rem;
      content: "✦";
      animation: twinkle 1.8s ease-in-out infinite;
    }

    .sparkle-line {
      margin: 0 0 8px;
      color: #e796b5;
      font-size: 1.15rem;
      letter-spacing: .45em;
      text-align: center;
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .hello {
      margin: 4px 0 8px;
      color: #278bd1;
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-shadow: 0 4px 0 #d8f1ff;
      animation: greetingWave 2.8s ease-in-out infinite;
    }

    .hello-heart {
      display: inline-block;
      color: #f18aaa;
      animation: heartBeat 1.1s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes greetingWave {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.2); }
      34% { transform: scale(1); }
      48% { transform: scale(1.14); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .55; transform: scale(.9) rotate(-8deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(8deg); }
    }

    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .mascot .ear {
      position: absolute;
      top: 0;
      width: 20px;
      height: 38px;
      border: 3px solid #4b9ed3;
      border-radius: 60% 60% 45% 45%;
      background: #dff4ff;
    }

    .mascot .ear.left { left: 15px; transform: rotate(-15deg); }
    .mascot .ear.right { right: 15px; transform: rotate(15deg); }

    .mascot .face {
      position: absolute;
      right: 2px;
      bottom: 0;
      left: 2px;
      height: 57px;
      border: 3px solid #4b9ed3;
      border-radius: 48% 48% 44% 44%;
      background: linear-gradient(145deg, #fff, #e4f6ff);
      box-shadow: 0 7px 14px rgba(39, 139, 209, .14);
    }

    .mascot .face::before {
      position: absolute;
      top: 23px;
      left: 17px;
      width: 6px;
      height: 8px;
      border-radius: 50%;
      background: #244966;
      box-shadow: 21px 0 #244966;
      content: "";
    }

    .mascot .face::after {
      position: absolute;
      top: 33px;
      left: 30px;
      width: 8px;
      height: 5px;
      border-radius: 50%;
      background: #f38ba9;
      content: "";
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-9px) rotate(4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    h1 {
      margin: 0 0 8px;
      color: #174d79;
      font-size: clamp(2.15rem, 6vw, 3.1rem);
      line-height: 1.3;
      letter-spacing: -.03em;
      text-align: center;
    }

    .intro {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.95;
      text-align: center;
    }

    .details {
      clear: both;
      margin-top: 42px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .detail {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(110deg, #f5fbff, #fff 78%);
      box-shadow: 0 5px 15px rgba(48, 112, 155, .045);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .detail:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(48, 112, 155, .1); }

    .icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      color: var(--blue-dark);
      background: #e0f3ff;
      font-size: 1.2rem;
    }

    .label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: .83rem;
    }

    .value {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .detail.identity {
      grid-column: span 1;
      display: block;
      min-height: 116px;
      padding: 18px;
      background: linear-gradient(145deg, #eef9ff, #fff 85%);
    }

    .detail.real-name {
      grid-column: 1 / -1;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      padding: 8px 10px 22px;
      text-align: center;
      border-radius: 0;
      border-bottom: 1px solid var(--line);
    }

    .identity .label { font-size: .95rem; }
    .identity .value { color: #174d79; font-size: 1.35rem; line-height: 1.6; overflow-wrap: anywhere; }
    .identity .value .nickname { color: #278bd1; font-size: 1.4rem; }
    .identity .value {
      animation: nameFloat 3s ease-in-out infinite;
      transform-origin: center;
    }
    .identity .nickname {
      display: inline-block;
      animation: nicknamePop 2.4s ease-in-out infinite;
    }

    @keyframes nameFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes nicknamePop {
      0%, 100% { transform: scale(1) rotate(0); }
      45% { transform: scale(1.07) rotate(-1deg); }
      60% { transform: scale(1.07) rotate(1deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .identity .value, .identity .nickname { animation: none; }
    }
    .detail.real-name { order: 1; }
    .detail.email { order: 2; grid-column: auto; }
    .details > article:nth-child(2) { order: 3; }
    .details > article:nth-child(4) { order: 4; }
    .details > article:nth-child(5) { order: 5; }
    .email a { color: #176da9; overflow-wrap: anywhere; }

    @media (max-width: 460px) {
      .profile { width: 108px; height: 108px; margin: 0 auto 18px; }
      .card { border-radius: 26px; }
      .details { grid-template-columns: 1fr; }
      .detail.real-name { grid-column: auto; }
      .detail.email { grid-column: auto; }
      .detail.identity { min-height: 0; }
      .mascot { right: 24px; transform: scale(.82); transform-origin: top right; }
      .bunny { right: 8px; bottom: 5px; transform: scale(.7); transform-origin: bottom right; opacity: .38; }
    }

    .footer {
      margin: 25px 0 0;
      color: #68849a;
      font-size: .85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bunny" aria-hidden="true">
    <span class="ear left"></span><span class="ear right"></span><span class="head"><i class="mouth"></i><i class="teeth"></i></span>
  </div>
  <main class="card">
    <p class="tag">ยินดีที่ได้รู้จัก</p>
    <div class="mascot" role="img" aria-label="กระต่ายการ์ตูนกำลังขยับดุ๊กดิ๊ก">
      <span class="ear left"></span><span class="ear right"></span><span class="face"></span>
    </div>
    <div class="profile-wrap">
    <div class="profile" role="img" aria-label="ภาพโปรไฟล์ของก้อย">
      <img src="profile.jpg" alt="รูปแนะนำตัวของก้อย">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="profileSky" x2="0" y2="1"><stop stop-color="#aee5ff"/><stop offset="1" stop-color="#fff0f7"/></linearGradient>
          <linearGradient id="hair" x2="1" y2="1"><stop stop-color="#9b685d"/><stop offset="1" stop-color="#64464b"/></linearGradient>
          <linearGradient id="dress" x2="0" y2="1"><stop stop-color="#ffb9d2"/><stop offset="1" stop-color="#f28eb7"/></linearGradient>
        </defs>
        <rect width="120" height="120" fill="url(#profileSky)"/>
        <circle cx="20" cy="25" r="7" fill="#fff" opacity=".45"/><circle cx="101" cy="39" r="9" fill="#fff" opacity=".42"/>
        <path d="M20 120c2-22 18-35 40-35s38 13 40 35" fill="#fff"/>
        <path d="M29 61c-5-28 7-47 31-47s37 19 31 48l-4 37H33z" fill="url(#hair)"/>
        <path d="M40 51c0-18 8-29 20-29s20 11 20 29v15c0 18-9 29-20 29S40 84 40 66z" fill="#ffdec9"/>
        <path d="M37 52c-2-22 9-38 27-38 16 0 27 12 25 31-9-1-19-8-25-17-6 10-15 17-27 19z" fill="url(#hair)"/>
        <path d="M41 48c7-2 13-7 17-13 4 6 10 10 21 12v10c-4-5-8-7-12-6-3 0-5 2-8 5-3-4-7-6-11-5-3 0-5 2-7 5z" fill="url(#hair)"/>
        <path d="M44 61c4-4 8-4 12 0M64 61c4-4 8-4 12 0" fill="none" stroke="#59434a" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="50" cy="65" r="2.1" fill="#49373a"/><circle cx="70" cy="65" r="2.1" fill="#49373a"/>
        <circle cx="51" cy="64" r=".7" fill="#fff"/><circle cx="71" cy="64" r=".7" fill="#fff"/>
        <ellipse cx="44" cy="72" rx="6" ry="3.5" fill="#f497b0" opacity=".7"/><ellipse cx="76" cy="72" rx="6" ry="3.5" fill="#f497b0" opacity=".7"/>
        <path d="M56 76c3 4 6 4 9 0" fill="none" stroke="#c66e7c" stroke-width="2" stroke-linecap="round"/>
        <path d="M39 95l21 13 21-13 14 25H25z" fill="url(#dress)"/><path d="M54 101l6 7 6-7-2 19h-8z" fill="#fff0f6"/>
        <path d="M34 30c-7-10 2-17 11-12 1-10 15-11 17-2 3-9 17-7 16 3 10-5 17 6 9 13-8 7-17 5-27 0-10 6-20 6-26-2z" fill="#ff8db9"/>
        <path d="M48 22l6 5-6 3-6-3zM73 22l-6 5 6 3 6-3z" fill="#ffd4e5"/>
        <circle cx="27" cy="47" r="2" fill="#fff"/><circle cx="94" cy="65" r="2.5" fill="#fff"/><path d="M91 24l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fff"/>
      </svg>
    </div>
    </div>
    <p class="hello">สวัสดี <span class="hello-heart" aria-hidden="true">♥</span></p>
    <h1>หน้าแนะนำตัว</h1>
    <p class="sparkle-line" aria-hidden="true">♡ · ✦ · ♡</p>
    <p class="intro">สวัสดีค่ะ นี่คือพื้นที่เล็ก ๆ สำหรับแนะนำตัวและสิ่งที่สนใจ 🌤️</p>

    <section class="details" aria-label="ข้อมูลแนะนำตัว">
      <article class="detail identity real-name">
        <span class="label">ชื่อจริง</span><p class="value">น.ส.ศรัณย์พร ม้าวิ่ง</p>
      </article>
      <article class="detail identity">
        <span class="label">ชื่อเล่น</span><p class="value nickname">ก้อย</p>
      </article>
      <article class="detail email">
        <span class="icon" aria-hidden="true">✉️</span>
        <div><span class="label">อีเมล</span><p class="value"><a href="mailto:saranphonkoi3909@gmail.com">saranphonkoi3909@gmail.com</a></p></div>
      </article>
      <article class="detail">
        <span class="icon" aria-hidden="true">💻</span>
        <div><span class="label">สาขา</span><p class="value">คอมพิวเตอร์</p></div>
      </article>
      <article class="detail">
        <span class="icon" aria-hidden="true">🛍️</span>
        <div><span class="label">ร้านโครงงาน</span><p class="value">ร้านคอมพิวเตอร์</p></div>
      </article>
    </section>
    <p class="footer">ขอบคุณที่แวะมาทักทายนะคะ ✨</p>
  </main>
</body>
</html>
